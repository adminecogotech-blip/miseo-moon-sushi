name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run security contract tests
        run: npm test

  isolated-preview-e2e:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/feat/production-parity-readiness'
    needs: security-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://miseo-moon-sushi-git-feat-production-parity-r-615461-evoluateam.vercel.app
      EXPECTED_REVISION: ${{ github.sha }}
      QA_USER: qa-admin
      RUN_PREVIEW_E2E: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install WebKit dependencies for mobile Safari parity
        run: npx playwright install --with-deps webkit
      - name: Capture offline reference and shell comparisons
        run: node tools/visual-preview.cjs
      - name: Wait for isolated preview deployment
        run: node tools/wait-preview.cjs
      - name: Run browser and operational end-to-end tests
        run: node --test tests/e2e-preview.test.js
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      - name: Verify mobile Safari-style WebKit layout
        run: node tools/verify-mobile-webkit.cjs
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-visual-screenshots
          path: |
            artifacts/screenshots/
            artifacts/visual/
          if-no-files-found: warn
