name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run security contract tests
        run: npm test

  isolated-preview-e2e:
    if: github.ref == 'refs/heads/feat/moon-fish-parity-auth'
    needs: security-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://miseo-moon-sushi-git-feat-moon-fish-parity-auth-evoluateam.vercel.app
      QA_USER: qa-admin
      QA_PASSWORD: MoonFish-QA-2026!
      RUN_PREVIEW_E2E: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for isolated preview deployment
        shell: bash
        run: |
          for i in $(seq 1 60); do
            HEALTH="$(curl -fsS "$BASE_URL/api/health" 2>/dev/null || true)"
            if echo "$HEALTH" | grep -q '"environment":"preview"'; then
              echo "Isolated preview is ready."
              echo "$HEALTH"
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not report environment=preview; no test mutations were sent."
          exit 1
      - name: Run browser and operational end-to-end tests
        run: node --test tests/e2e-preview.test.js
